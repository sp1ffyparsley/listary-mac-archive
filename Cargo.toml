[workspace]
resolver = "2"
members = [
    "rust/listary-agent",
    "rust/listary-core",
    "rust/listary-ffi",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5"
fs2 = "0.4"
parking_lot = "0.12"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
regex = "1"
roaring = { version = "0.11", features = ["serde"] }
rocksdb = { version = "0.24", default-features = false, features = ["multi-threaded-cf", "snappy"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
walkdir = "2"
